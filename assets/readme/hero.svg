<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Professional Association website template</title>
  <desc id="heroDesc">An editorial, multi-page website for a professional membership association, built as static HTML and Tailwind CSS and deployable on GitHub Pages. A miniature of the homepage sits on the right: a navy hero with a serif headline, a gold Become a Member button, and a strip of member statistics.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2340"/>
      <stop offset="1" stop-color="#091728"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c19a3e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c19a3e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="miniHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2340"/>
      <stop offset="1" stop-color="#16385f"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="300" fill="url(#goldGlow)"/>

  <!-- ── LEFT · title block ── -->
  <g transform="translate(64 52)">
    <!-- brand lockup: PA monogram + wordmark -->
    <rect x="0" y="0" width="46" height="46" fill="#c19a3e"/>
    <text x="23" y="31" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#0c2340">PA</text>
    <text x="60" y="19" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#ffffff">Professional Association</text>
    <text x="60" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="3.2" fill="#8ea2bd">OF CAMBODIA</text>

    <!-- eyebrow -->
    <text x="1" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3.6" fill="#c19a3e">STATIC MEMBERSHIP-ASSOCIATION WEBSITE</text>

    <!-- headline -->
    <text x="0" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="37" fill="#ffffff">A complete, editorial website</text>
    <text x="0" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="37" fill="#ffffff">for a professional association.</text>

    <!-- gold hairline divider (the site's own motif) -->
    <rect x="1" y="222" width="64" height="3" fill="#c19a3e"/>

    <!-- metadata -->
    <text x="0" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" letter-spacing="0.6" fill="#9fb0c6">12 pages  <tspan fill="#c19a3e">·</tspan>  Tailwind CSS  <tspan fill="#c19a3e">·</tspan>  vanilla JS  <tspan fill="#c19a3e">·</tspan>  GitHub Pages</text>
  </g>

  <!-- ── RIGHT · homepage miniature ── -->
  <g transform="translate(724 68)">
    <!-- browser frame -->
    <rect x="0" y="0" width="412" height="224" rx="10" fill="#ffffff"/>
    <rect x="0" y="0" width="412" height="30" rx="10" fill="#eef1f5"/>
    <rect x="0" y="18" width="412" height="12" fill="#eef1f5"/>
    <circle cx="18" cy="15" r="4" fill="#d3d9e2"/>
    <circle cx="34" cy="15" r="4" fill="#d3d9e2"/>
    <circle cx="50" cy="15" r="4" fill="#d3d9e2"/>
    <rect x="70" y="9" width="322" height="13" rx="6.5" fill="#ffffff"/>
    <text x="80" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#9aa7b8">association-website</text>

    <!-- mini navy hero -->
    <rect x="0" y="30" width="412" height="150" fill="url(#miniHero)"/>
    <!-- mini brand + nav -->
    <rect x="20" y="44" width="16" height="16" fill="#c19a3e"/>
    <text x="42" y="56" font-family="Georgia, serif" font-size="9.5" fill="#ffffff">Professional Association</text>
    <text x="250" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#b9c6d8">About  Membership  Events  Advocacy</text>
    <!-- mini headline -->
    <text x="20" y="104" font-family="Georgia, serif" font-size="20" fill="#ffffff">The Professional</text>
    <text x="20" y="128" font-family="Georgia, serif" font-size="20" fill="#ffffff">Association of Cambodia</text>
    <!-- gold CTA pill -->
    <rect x="20" y="146" width="118" height="20" fill="#c19a3e"/>
    <text x="79" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" letter-spacing="1.2" fill="#ffffff">BECOME A MEMBER</text>

    <!-- stats strip -->
    <g font-family="Georgia, serif" fill="#0c2340">
      <text x="52" y="204" text-anchor="middle" font-size="16">150+</text>
      <text x="154" y="204" text-anchor="middle" font-size="16">25+</text>
      <text x="256" y="204" text-anchor="middle" font-size="16">50+</text>
      <text x="358" y="204" text-anchor="middle" font-size="16">12</text>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="#8a97a8" text-anchor="middle">
      <text x="52" y="216">MEMBERS</text>
      <text x="154" y="216">YEARS</text>
      <text x="256" y="216">EVENTS</text>
      <text x="358" y="216">COMMITTEES</text>
    </g>
  </g>
</svg>
